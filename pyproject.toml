[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exmaterial"
version = "1.0.1"
description = "A Windows desktop app for material-sample records, XRD processing, and thermal-conductivity plots."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [
  { name = "ExMaterial contributors" },
]
dependencies = [
  "Pillow>=10.0",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
exmaterial = "exmaterial.exmaterial_app:main"

[project.urls]
Homepage = "https://github.com/LYKD/ExMaterial"
Issues = "https://github.com/LYKD/ExMaterial/issues"

[tool.setuptools]
packages = ["exmaterial"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
